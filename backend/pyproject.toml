[project]
name = "agri-assistant-backend"
version = "0.1.0"
description = "API de consultation des prix agricoles pour le MVP Bénin"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20.1",
  "fastapi>=0.115",
  "psycopg[binary]>=3.3.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.1.9",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "bandit>=1.8",
  "httpx2>=2.16.2",
  "pip-audit>=2.7",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S108"]

[tool.bandit]
exclude_dirs = ["tests"]
targets = ["app"]
