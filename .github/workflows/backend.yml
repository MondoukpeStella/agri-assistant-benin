name: backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Lint, test, and audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agri
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agri -d agri_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://agri@localhost:5432/agri_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv 0.13.1
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Bandit
        run: uv run bandit -r app -q

      - name: Dependency audit
        run: uv run pip-audit
