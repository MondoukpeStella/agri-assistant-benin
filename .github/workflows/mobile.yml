name: mobile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets and sensitive files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks 8.30.1
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan Git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Reject tracked sensitive files
        run: scripts/check-sensitive-files.sh --tracked

  mobile:
    name: Lint, test, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
